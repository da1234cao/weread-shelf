{% extends "base.html" %}
{% block content %}
<h1>阅读概览</h1>

<div class="subtabs" id="modeTabs">
  <button class="subtab" data-mode="weekly">周</button>
  <button class="subtab active" data-mode="monthly">月</button>
  <button class="subtab" data-mode="annually">年</button>
  <button class="subtab" data-mode="overall">总</button>
</div>

<div class="period-nav" id="periodNav">
  <button id="prevBtn" class="period-btn" aria-label="上一周期">‹</button>
  <span id="periodLabel" class="period-label">…</span>
  <button id="nextBtn" class="period-btn" aria-label="下一周期">›</button>
</div>

<div class="cards" id="statCards"></div>

<div class="section">
  <h2>阅读时长分布</h2>
  <div class="chart-card"><canvas id="distChart" height="90"></canvas></div>
</div>

<div class="section">
  <h2>总体偏好</h2>
  <div class="chart-grid">
    <div class="chart-card"><h2>偏好分类（累计阅读秒）</h2><canvas id="categoryChart" height="160"></canvas></div>
    <div class="chart-card"><h2>24 小时阅读分布</h2><canvas id="hourChart" height="160"></canvas></div>
    <div class="chart-card">
      <h2>偏好作者</h2>
      <div class="tag-list" id="authorTags"><span class="sub">加载中…</span></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
{% endblock %}
