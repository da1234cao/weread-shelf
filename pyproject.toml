[project]
name = "weread-shelf"
version = "0.1.0"
description = "Self-hosted dashboard that pulls your WeRead (微信读书) data daily and shows long-term trends."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "sqlmodel>=0.0.16",
    "jinja2>=3.1",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
weread-shelf = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]
packages = ["app"]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
