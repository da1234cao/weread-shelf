services:
  weread-shelf:
    image: registry.gitlab.com/da1234cao/weread-shelf:latest
    # To build from source instead, uncomment the next line and run
    # `docker compose up -d --build`.
    # build: .
    container_name: weread-shelf
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - weread_db_data:/data

volumes:
  weread_db_data:
    name: weread_db_data
