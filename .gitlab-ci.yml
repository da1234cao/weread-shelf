# Build the Docker image and push it to the GitLab Container Registry.
#
# Runs only when a Git tag is pushed, e.g.:
#     git tag v0.1.0
#     git push origin v0.1.0
#
# Authentication uses the built-in CI_REGISTRY_* variables (backed by
# CI_JOB_TOKEN), so no secrets need to be configured. The image is pushed
# under two tags: the Git tag itself and `latest`.

stages:
  - build

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
